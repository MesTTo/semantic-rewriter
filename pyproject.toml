# Purpose: declare the semantic rewriter's package: a dependency-free core, optional extras for each backend, the command line, and the CUDA torch index uv installs from.
[project]
name = "semantic-rewriter"
version = "0.1.0"
description = "Semantic rewriting for logic engines: discover implications between predicates with an entailment judge, admit them as rules, and evaluate exactly on any engine with tables."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MesTTo" }]
requires-python = ">=3.11"
keywords = ["logic programming", "tabling", "SLG", "MeTTa", "natural language inference", "query rewriting", "Datalog"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
pymetta = ["pymetta>=0.9.4,<0.10"]
models = ["torch>=2.8", "sentence-transformers>=5.0", "transformers>=4.51", "numpy>=2.0"]
jev = ["typesafe-sdk==0.7.0"]
conformance = ["hypothesis>=6.100"]
all = ["semantic-rewriter[pymetta,models,jev,conformance]"]

[project.scripts]
semrewrite = "semrewrite.cli:main"

[project.urls]
Design = "https://github.com/MesTTo/semantic-rewriter/blob/main/DESIGN.md"
Results = "https://github.com/MesTTo/semantic-rewriter/blob/main/RESULTS.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8",
    "pytest-split>=0.11",
    "hypothesis>=6.100",
    "ruff==0.17.4",
    "ty==0.0.99",
]

[tool.uv]
package = true
# The lock covers Python 3.12 and later, where every extra resolves (pymetta 0.9.4 needs 3.12);
# the core alone also installs on 3.11, which CI tests with pip.
environments = ["python_version >= '3.12'"]

[tool.uv.sources]
# CUDA 12.8 wheels where the index has them; elsewhere, such as macOS, torch comes from PyPI.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semrewrite"]

[tool.hatch.build.targets.sdist]
exclude = ["ai-tmp", "ai-battery-*", "worktrees", "data/raw", "results", ".docutouch"]

[tool.ruff]
# The code's own style: 99% of its lines fit in 120 columns.
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
