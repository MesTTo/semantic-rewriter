# ---------------------------------------------------------------- causation

[[relations]]
premise = "causes"
conclusion = "correlated_with"
holds = "neither"
reason = "a cause can be masked by an opposing path or act non-linearly, leaving no correlation, so causation does not entail correlation; a correlation may come from a common cause"

[[relations]]
premise = "correlated_with"
conclusion = "correlated_with"
swapped = true
holds = "both"
reason = "correlation is symmetric"

[[relations]]
premise = "causes"
conclusion = "causes"
swapped = true
holds = "neither"
reason = "causation runs one way between a factor and its outcome"

[[relations]]
premise = "causes"
conclusion = "contributes_to"
holds = "forward"
reason = "a cause contributes to its effect; a contributing factor may be insufficient to cause it"

[[relations]]
premise = "causes"
conclusion = "caused_by"
swapped = true
holds = "both"
reason = "B causing A says exactly that A is caused by B"

[[relations]]
premise = "causes"
conclusion = "prevents"
holds = "neither"
reason = "causing and preventing an outcome are opposites"

[[relations]]
premise = "causes"
conclusion = "influences"
holds = "forward"
reason = "causing an outcome is influencing it; influence may fall short of causing it"

[[relations]]
premise = "cures"
conclusion = "treats"
holds = "forward"
reason = "a cure is a treatment; most treatments do not cure"

[[relations]]
premise = "prevents"
conclusion = "treats"
holds = "neither"
reason = "prevention acts before a disease and treatment after it; a vaccine prevents without treating"

