# Purpose: hand-labelled hard predicate pairs over kinship, employment, causation and location,
# the source semrewrite/pairs.py turns into data/pairs/hard.jsonl.
#
# A relation names a premise and a conclusion predicate and says which way entailment holds by
# the meaning of the words, in every possible situation, not merely usually:
#   forward  the premise entails the conclusion and not the reverse
#   both     each entails the other
#   neither  no direction holds
# swapped = true reads the premise with its arguments exchanged: premise(y, x) against
# conclusion(x, y). A relation from a predicate to itself with swapped = true asks whether the
# predicate is symmetric and yields one row; every other relation yields its forward and reverse row.
# Types name the kinds of a predicate's first and second argument, used for typed-noun fillers.
# Glosses avoid personal names, so no filler carries a gender.

[predicates]
mother = { gloss = "{x} is the mother of {y}", types = ["person", "person"] }
father = { gloss = "{x} is the father of {y}", types = ["person", "person"] }
parent = { gloss = "{x} is a parent of {y}", types = ["person", "person"] }
