# ---------------------------------------------------------------- kinship

[[relations]]
premise = "mother"
conclusion = "parent"
holds = "forward"
reason = "a mother of someone is one of their parents; a parent may be their father"

[[relations]]
premise = "father"
conclusion = "parent"
holds = "forward"
reason = "a father of someone is one of their parents; a parent may be their mother"

[[relations]]
premise = "child"
conclusion = "parent"
swapped = true
holds = "both"
reason = "B being a child of A says exactly that A is a parent of B"

[[relations]]
premise = "parent"
conclusion = "child"
holds = "neither"
reason = "same words, arguments in the wrong order: a parent of B is not a child of B"

[[relations]]
premise = "son"
conclusion = "child"
holds = "forward"
reason = "a son of someone is their child; a child may be a daughter"

[[relations]]
premise = "daughter"
conclusion = "child"
holds = "forward"
reason = "a daughter of someone is their child; a child may be a son"

[[relations]]
