# Purpose: the hand audit of the Wikidata pair set that semrewrite/pairs.py applies over the raw
# SPARQL results: glosses where rule_gloss misreads a property label, properties left out with the
# reason, and labels corrected where the hierarchy lacks an edge.
#
# A gloss states a property over its subject {x} and value {y}: P25 mother is "{y} is the mother
# of {x}", since Wikidata reads (Tom, mother, Alice) as "Alice is the mother of Tom".

