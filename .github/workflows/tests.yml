# Purpose: run the test suite on every push and pull request: the dependency-free core with the pure-Python engine on three Python versions, with the Levy/Holt and Balanced COPA pairs fetched at their pinned revisions, and the PyMeTTa engine, whose property tests and conformance run under the ci Hypothesis profile (100 cases each) on every vCPU of the runner, and ruff 0.17.4 over the tree.
name: tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[conformance]" pytest
      - run: python -m semrewrite.pairs fetch levyholt && python -m semrewrite.pairs build levyholt
      - run: python -m semrewrite.pairs fetch copa && python -m semrewrite.pairs build copa
      - run: pytest -q -rs
      - run: semrewrite conformance --engine python --examples 200
  # pytest-xdist runs the tests on all of the runner's vCPUs. Most tests take milliseconds and the slowest minutes,
  # so --dist worksteal lets a worker that runs out take tests still queued on another.
  pymetta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[pymetta,conformance]" pytest pytest-xdist
      - run: pytest -q -rs --hypothesis-profile=ci -n auto --dist worksteal --durations=10
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.4
      - run: ruff check .
